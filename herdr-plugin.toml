id = "adriankarlen.sesh-minimal"
name = "Sesh Minimal for Herdr"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Minimal Sesh-style workspace/session manager for Herdr using gum"
platforms = ["linux", "macos"]

[[build]]
command = [
  "go",
  "build",
  "-ldflags=-X=github.com/adriankarlen/herdr-sesh-minimal/internal/app.Version=0.1.0",
  "-o",
  "bin/",
  "./cmd/herdr-sesh-minimal",
]

[[startup]]
command = ["./bin/herdr-sesh-minimal", "plugin", "watch-history"]

[[events]]
on = "workspace.focused"
command = ["./bin/herdr-sesh-minimal", "plugin", "watch-history"]

[[events]]
on = "workspace.closed"
command = ["./bin/herdr-sesh-minimal", "plugin", "watch-history"]

[[actions]]
id = "open-picker"
title = "Open Sesh Minimal Picker"
contexts = ["workspace", "pane"]
command = ["./bin/herdr-sesh-minimal", "plugin", "open-picker"]

[[actions]]
id = "last"
title = "Switch to Previous Workspace"
contexts = ["workspace", "pane"]
command = ["./bin/herdr-sesh-minimal", "last"]

[[panes]]
id = "picker"
title = "Sesh Picker"
placement = "overlay"
command = ["./bin/herdr-sesh-minimal", "picker"]
